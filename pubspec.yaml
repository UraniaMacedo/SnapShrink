name: reduzir_app
description: "App para reduzir vídeos e imagens para WhatsApp e Instagram."
publish_to: 'none'

version: 1.0.2+8

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Selecionar imagens e arquivos
  image_picker: ^1.0.7
  file_picker: ^8.0.0

  # Reduzir imagens
  image: ^4.1.3
  flutter_image_compress: ^2.1.0
  path_provider: ^2.1.1

  # Reduzir vídeos
  video_compress: ^3.1.2

  # Compartilhar arquivos
  share_plus: ^7.1.0

  # Anúncios
  google_mobile_ads: ^5.3.1

  # Abrir política de privacidade/link externo
  url_launcher: ^6.2.1

  # Assinaturas
  in_app_purchase: ^3.3.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#673AB7"
  adaptive_icon_foreground: "assets/icon/app_icon.png"